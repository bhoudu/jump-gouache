name: Build & Test
on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # This automatically handles caching for ~/.npm
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        # --frozen-lockfile equivalent for npm is 'ci' (clean install)
        run: npm ci

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Test
        run: npm test --workspaces
        env:
          NODE_ENV: test

      - name: Verify JSON
        # Assuming this is a custom script in your root package.json
        run: npm run verify:json --if-present

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports

      - name: define SONAR_VERSION env variable
        # npx works the same, but we ensure it uses the local version if available
        run: |
          echo "SONAR_VERSION=$(npx project-version)" >> $GITHUB_ENV

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ env.SONAR_VERSION }}
